<text x="1220" y="755" font-size="19" class="muted" text-anchor="start">Color identifies a control or release.</text>
<text x="1220" y="786" font-size="19" class="muted" text-anchor="start">Small display stays flush with the top.</text>
<text x="1220" y="817" font-size="19" class="muted" text-anchor="start">The battery latch is recessed beneath.</text>
<text x="1220" y="848" font-size="19" class="muted" text-anchor="start">Interface graphics are illustrative.</text>
<text x="60" y="995" font-size="16" class="mono" text-anchor="start">REFERENCE TRANSLATION</text>
<text x="60" y="1032" font-size="20" class="muted" text-anchor="start">Restrained surfaces, legible controls and deliberate details. Compact sensing and concentrated hip volumes.</text>
<text x="60" y="1064" font-size="20" class="muted" text-anchor="start">Tinfox: curved printed shells, remote knee actuation, replaceable slim legs and underside tool-battery access.</text>
