<text x="80" y="755" font-size="19" class="muted" text-anchor="start">A single optical window.</text>
<text x="80" y="786" font-size="19" class="muted" text-anchor="start">Flush graphics and visible service screws.</text>
<text x="80" y="817" font-size="19" class="muted" text-anchor="start">Rounded shell over a dark structural frame.</text>
<text x="80" y="848" font-size="19" class="muted" text-anchor="start">Sensor coverage requires engineering.</text>
<text x="650" y="289" font-size="19" class="mono" text-anchor="start">02 / actuator cover</text>
