<text x="650" y="755" font-size="19" class="muted" text-anchor="start">Plain circular covers with a datum mark.</text>
<text x="650" y="786" font-size="19" class="muted" text-anchor="start">One short orange index; no glowing rings.</text>
<text x="650" y="817" font-size="19" class="muted" text-anchor="start">Tiny identifiers support assembly and service.</text>
<text x="650" y="848" font-size="19" class="muted" text-anchor="start">This is a cover, not an extra knee actuator.</text>
<text x="1220" y="289" font-size="19" class="mono" text-anchor="start">03 / access &amp; controls</text>
