<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
<title id="title">surface, interface, service</title><desc id="desc">A precision-instrument aesthetic: restrained surfaces, legible controls and functional details. Exterior concept only; motor packaging, transmission and structural performance are unverified.</desc>
