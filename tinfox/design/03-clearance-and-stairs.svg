<text x="88.00" y="1122.00" class="small" text-anchor="start">Reference staircase; no climbing pose has been validated.</text>
<text x="770.00" y="850.00" class="label" text-anchor="start">249 mm raised belly clearance does not mean a</text>
<text x="770.00" y="880.00" class="label" text-anchor="start">249 mm obstacle can be stepped over.</text>
<text x="770.00" y="910.00" class="label" text-anchor="start">The foot must clear the nose, land on the tread,</text>
<text x="770.00" y="940.00" class="label" text-anchor="start">and support the body without link or battery contact.</text>
<text x="770.00" y="1005.00" class="caption" text-anchor="start">Straight-leg geometric limit: 270 mm / 10.6 in beneath skid.</text>
<text x="770.00" y="1035.00" class="caption" text-anchor="start">A deeper battery enclosure reduces all values equally.</text>
<text x="770.00" y="1065.00" class="caption" text-anchor="start">Knee linkage travel and self-righting remain unverified.</text>
