<text x="966.00" y="516.53" class="dim" text-anchor="middle">209 mm</text>
<text x="980.00" y="684.00" class="small" text-anchor="end">8.2 in belly clearance</text>
<line x1="245.00" y1="710.00" x2="765.00" y2="710.00" stroke="#60737a" stroke-width="1.2" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="505.00" y="700.00" class="dim" text-anchor="middle">400 mm hip spacing • provisional</text>
<text x="1095.00" y="195.00" class="section" text-anchor="start">DESIGN INTENT</text>
<text x="1095.00" y="235.00" class="caption" text-anchor="start">All 12 actuators remain RS-02.</text>
<text x="1095.00" y="260.00" class="caption" text-anchor="start">Knee motors move with the upper thigh,</text>
<text x="1095.00" y="285.00" class="caption" text-anchor="start">close to the hip to reduce swing inertia.</text>
<line x1="1095.00" y1="310.00" x2="1530.00" y2="310.00" stroke="#d6dfdd" stroke-width="2" stroke-linecap="round"/>
<text x="1095.00" y="349.00" class="section" text-anchor="start">Recess the battery cassette</text>
<text x="1095.00" y="385.00" class="caption" text-anchor="start">Two packs sit fore–aft beneath the body.</text>
<text x="1095.00" y="410.00" class="caption" text-anchor="start">The illustrated pack envelope is a placeholder.</text>
<text x="1095.00" y="435.00" class="caption" text-anchor="start">It does not establish fit for DeWalt or M18.</text>
<text x="1095.00" y="460.00" class="caption" text-anchor="start">A 70 mm hip-to-skid drop requires the</text>
<text x="1095.00" y="485.00" class="caption" text-anchor="start">packs to extend upward into the chassis.</text>
<line x1="1095.00" y1="521.00" x2="1530.00" y2="521.00" stroke="#d6dfdd" stroke-width="2" stroke-linecap="round"/>
<text x="1095.00" y="558.00" class="section" text-anchor="start">Keep recovery contact off sensors</text>
<text x="1095.00" y="594.00" class="caption" text-anchor="start">Rounded side covers and upper guards</text>
<text x="1095.00" y="619.00" class="caption" text-anchor="start">need to carry rollover contact loads.</text>
<text x="1095.00" y="644.00" class="caption" text-anchor="start">The LiDAR shown here is not yet protected.</text>
<text x="1095.00" y="669.00" class="caption" text-anchor="start">Self-righting clearance is unverified.</text>
<line x1="1095.00" y1="706.00" x2="1530.00" y2="706.00" stroke="#d6dfdd" stroke-width="2" stroke-linecap="round"/>
<text x="1095.00" y="744.00" class="section" text-anchor="start">Shape follows the mechanism</text>
<text x="1095.00" y="780.00" class="caption" text-anchor="start">Broad, rounded hips taper into slim shins.</text>
<text x="1095.00" y="805.00" class="caption" text-anchor="start">Covers can conceal the rod while opening</text>
<text x="1095.00" y="830.00" class="caption" text-anchor="start">for bearing and fastener access.</text>
<text x="1095.00" y="855.00" class="caption" text-anchor="start">Printed curves are a styling study; wall</text>
<text x="1095.00" y="880.00" class="caption" text-anchor="start">thickness and strength are not specified.</text>
<rect x="1095" y="935" width="435" height="72" rx="16" fill="#fff0d6" stroke="none"/>
<text x="1110.00" y="964.00" class="small" text-anchor="start">REVIEW: proportions, battery position,</text>
<text x="1110.00" y="987.00" class="small" text-anchor="start">leg curvature and motor concentration.</text>
<text x="65.00" y="800.00" class="section" text-anchor="start">TOP VIEW / WIDTH IS A DESIGN VARIABLE</text>
