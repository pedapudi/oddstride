<text x="870.00" y="947.00" class="small" text-anchor="middle">chassis width</text>
<text x="870.00" y="971.00" class="small" text-anchor="middle">provisional</text>
<text x="80.00" y="1030.00" class="small" text-anchor="start">Hip modules extend beyond the chassis. Overall width and bearing stacks remain unresolved.</text>
