<rect width="1240" height="800" fill="#f3f5ee"/>
<text class="title" x="42" y="48">tinfox · low sensor saddle</text>
<text class="t" x="42" y="78">A short structural mount with one low cover flowing forward to the camera face.</text>
<rect x="24" y="105" width="776" height="420" rx="16" fill="#e9ede2"/>
<text class="h" x="46" y="138">Side profile</text>
<!-- Body and existing tall silhouette, shown only for comparison -->
<path class="shell" d="M60 345 Q60 327 80 325 H440 L454 337 V409 Q448 419 432 419 H83 Q60 419 60 396Z"/>
<path class="ghost" d="M305 325 L315 254 Q323 239 345 239 H379 Q395 244 404 262 L482 267 L542 267 L583 289 L635 340"/>
<rect class="ghost" x="327" y="197" width="66" height="42" rx="7"/>
<text class="s" x="64" y="189">Current tall mount (dashed)</text><path class="line" d="M258 185 H291 L324 216"/>
<!-- New low hood: broad root, short flat crown, then downward camera brow -->
<path class="shell" d="M294 325 Q310 309 338 300 Q352 294 372 294 H428 Q454 296 483 305 Q542 322 583 334 L637 348 L637 374 L585 359 Q536 341 479 332 Q430 324 390 325Z"/>
<!-- Exposed sensor with concealed base -->
