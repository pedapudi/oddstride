<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800">
<defs><style>text{font-family:Arial,sans-serif;fill:#283b32}.title{font-size:28px;font-weight:600}.h{font-size:19px;font-weight:600}.t{font-size:15px}.s{font-size:13px;fill:#526359}.dim{stroke:#c96734;stroke-width:1.7;fill:none}.line{stroke:#66796c;stroke-width:1.4;fill:none}.shell{fill:#e5dfd3;stroke:#66796c;stroke-width:1.7}.metal{fill:#9aa8a0;stroke:#526359;stroke-width:1.5}.ghost{stroke:#b6bdb5;stroke-width:1.5;stroke-dasharray:6 6;fill:none}</style>
