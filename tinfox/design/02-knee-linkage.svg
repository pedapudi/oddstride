<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
<title id="title">Tinfox: How the rigid knee linkage works</title><desc id="desc">Mechanism explanation • equal cranks show motion transfer • the torque-multiplying geometry is not selected Preliminary concept drawing; no parts are qualified for manufacture.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 z" fill="#60737a"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#183038}.small{font-size:16px;fill:#60737a}.label{font-size:19px}.caption{font-size:17px;fill:#60737a}.title{font-size:40px;font-weight:700}.section{font-size:23px;font-weight:700}.dim{font-size:16px;fill:#087e8b}</style>
<rect x="0" y="0" width="1600" height="1100" rx="0" fill="#f3f2ec" stroke="none"/>
<text x="44.00" y="44.00" class="small" text-anchor="start">ODDSTRIDE / TINFOX</text>
<text x="44.00" y="95.00" class="title" text-anchor="start">02  How the rigid knee linkage works</text>
<text x="44.00" y="126.00" class="caption" text-anchor="start">Mechanism explanation • equal cranks show motion transfer • the torque-multiplying geometry is not selected</text>
<text x="44.00" y="1082.00" class="small" text-anchor="start">CONCEPT REVIEW • 170 mm links • All RS-02 • Dimensions in mm • Not manufacturing drawings</text>
<rect x="40" y="155" width="930" height="885" rx="16" fill="#fffefa" stroke="none"/>
<rect x="990" y="155" width="570" height="885" rx="16" fill="#fffefa" stroke="none"/>
<text x="65.00" y="193.00" class="section" text-anchor="start">SIDE VIEW / THIGH HELD STILL FOR EXPLANATION</text>
<path d="M 291.3 310.0 C 276.0 378.0 293.0 548.0 298.1 650.0 L 321.9 650.0 C 330.4 548.0 337.2 378.0 328.7 310.0 Z" fill="#cce4e3" stroke="#087e8b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="310.00" y1="310.00" x2="310.00" y2="650.00" stroke="#087e8b" stroke-width="1" stroke-linecap="round" stroke-dasharray="5 7"/>
<path d="M 296.04556458132924 655.0789991283862 C 307.8856689849259 723.1336420832348 378.71494373089945 878.2641156819427 417.40675346430055 972.7275814216364 L 435.16694399715425 966.2634007127813 C 406.6238145682409 868.1061174251704 353.5547303551211 706.5114631176074 323.95443541867076 644.9210008716138 Z" fill="#e9eee5" stroke="#087e8b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
