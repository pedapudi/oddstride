<circle cx="310.00" cy="310.00" r="65" fill="#d6e8e7" stroke="#087e8b" stroke-width="3"/>
<circle cx="310.00" cy="310.00" r="39" fill="#fffefa" stroke="#087e8b" stroke-width="2"/>
<line x1="310.00" y1="310.00" x2="356.98" y2="292.90" stroke="#d46b32" stroke-width="11" stroke-linecap="round"/>
<line x1="356.98" y1="292.90" x2="356.98" y2="632.90" stroke="#d46b32" stroke-width="8" stroke-linecap="round"/>
<line x1="310.00" y1="650.00" x2="356.98" y2="632.90" stroke="#087e8b" stroke-width="12" stroke-linecap="round"/>
<circle cx="310.00" cy="310.00" r="8" fill="#fffefa" stroke="#183038" stroke-width="2"/>
<circle cx="310.00" cy="310.00" r="2.5" fill="#183038" stroke="none" stroke-width="2"/>
<text x="288.00" y="290.00" class="section" text-anchor="start">A</text>
<circle cx="356.98" cy="292.90" r="8" fill="#fffefa" stroke="#183038" stroke-width="2"/>
<circle cx="356.98" cy="292.90" r="2.5" fill="#183038" stroke="none" stroke-width="2"/>
<text x="372.98" y="282.90" class="section" text-anchor="start">B</text>
<circle cx="356.98" cy="632.90" r="8" fill="#fffefa" stroke="#183038" stroke-width="2"/>
<circle cx="356.98" cy="632.90" r="2.5" fill="#183038" stroke="none" stroke-width="2"/>
<text x="374.98" y="632.90" class="section" text-anchor="start">C</text>
<circle cx="310.00" cy="650.00" r="8" fill="#fffefa" stroke="#183038" stroke-width="2"/>
<circle cx="310.00" cy="650.00" r="2.5" fill="#183038" stroke="none" stroke-width="2"/>
<text x="284.00" y="654.00" class="section" text-anchor="start">D</text>
<circle cx="426.29" cy="969.50" r="16" fill="#183038" stroke="none" stroke-width="2"/>
<line x1="185.00" y1="310.00" x2="185.00" y2="650.00" stroke="#60737a" stroke-width="1.2" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="133.00" y="485.00" class="dim" text-anchor="middle">170 mm</text>
<text x="130.00" y="510.00" class="small" text-anchor="middle">illustrative A–D</text>
<line x1="310.00" y1="246.00" x2="450.00" y2="246.00" stroke="#60737a" stroke-width="1.3" stroke-linecap="round"/>
<line x1="450.00" y1="246.00" x2="450.00" y2="230.00" stroke="#60737a" stroke-width="1.3" stroke-linecap="round"/>
<circle cx="310.00" cy="246.00" r="3" fill="#60737a" stroke="none" stroke-width="2"/>
<text x="470.00" y="235.00" class="caption" text-anchor="start">A: knee motor output axis</text>
<text x="470.00" y="264.00" class="small" text-anchor="start">Motor housing fixed to the upper thigh.</text>
<text x="470.00" y="289.00" class="small" text-anchor="start">The hip-pitch motor moves this whole assembly.</text>
<line x1="334.00" y1="301.00" x2="435.00" y2="345.00" stroke="#60737a" stroke-width="1.3" stroke-linecap="round"/>
<circle cx="334.00" cy="301.00" r="3" fill="#60737a" stroke="none" stroke-width="2"/>
<text x="470.00" y="351.00" class="caption" text-anchor="start">A–B: short motor crank</text>
<text x="470.00" y="378.00" class="small" text-anchor="start">25 mm radius in this explanation</text>
<line x1="356.98" y1="460.00" x2="440.00" y2="460.00" stroke="#60737a" stroke-width="1.3" stroke-linecap="round"/>
<circle cx="356.98" cy="460.00" r="3" fill="#60737a" stroke="none" stroke-width="2"/>
<text x="470.00" y="466.00" class="caption" text-anchor="start">B–C: rigid push–pull rod</text>
<text x="470.00" y="496.00" class="small" text-anchor="start">Rod pivots at both ends.</text>
<text x="470.00" y="521.00" class="small" text-anchor="start">It transfers tension and compression.</text>
<text x="470.00" y="546.00" class="small" text-anchor="start">Shown outside the cover for visibility.</text>
<line x1="333.00" y1="642.00" x2="440.00" y2="615.00" stroke="#60737a" stroke-width="1.3" stroke-linecap="round"/>
<circle cx="333.00" cy="642.00" r="3" fill="#60737a" stroke="none" stroke-width="2"/>
<text x="470.00" y="621.00" class="caption" text-anchor="start">D–C: lever rigidly attached to shin</text>
<text x="470.00" y="650.00" class="small" text-anchor="start">25 mm radius; rotates about knee pivot D</text>
<line x1="310.00" y1="667.00" x2="185.00" y2="710.00" stroke="#60737a" stroke-width="1.3" stroke-linecap="round"/>
<circle cx="310.00" cy="667.00" r="3" fill="#60737a" stroke="none" stroke-width="2"/>
<text x="80.00" y="737.00" class="caption" text-anchor="start">D: supported knee axle</text>
<line x1="388.00" y1="865.00" x2="510.00" y2="865.00" stroke="#60737a" stroke-width="1.3" stroke-linecap="round"/>
<circle cx="388.00" cy="865.00" r="3" fill="#60737a" stroke="none" stroke-width="2"/>
<text x="530.00" y="870.00" class="caption" text-anchor="start">Shin and knee lever turn together</text>
<text x="65.00" y="1008.00" class="small" text-anchor="start">The thigh is the fourth link: A → B → C → D → A. Hip axis placement is not resolved here.</text>
<text x="1015.00" y="197.00" class="section" text-anchor="start">What happens when the motor turns</text>
<text x="1015.00" y="237.00" class="label" text-anchor="start">1. The motor rotates crank A–B.</text>
<text x="1015.00" y="269.00" class="label" text-anchor="start">2. The crank pushes or pulls rod B–C.</text>
<text x="1015.00" y="301.00" class="label" text-anchor="start">3. The rod turns lever D–C and the shin.</text>
<text x="1015.00" y="333.00" class="label" text-anchor="start">4. Bearings at D carry the knee support loads.</text>
<line x1="1015.00" y1="371.00" x2="1535.00" y2="371.00" stroke="#d6dfdd" stroke-width="2" stroke-linecap="round"/>
<text x="1015.00" y="408.00" class="section" text-anchor="start">This drawing transfers motion 1:1</text>
<text x="1015.00" y="446.00" class="caption" text-anchor="start">Equal cranks and equal long links form a</text>
<text x="1015.00" y="471.00" class="caption" text-anchor="start">parallelogram. Away from aligned positions,</text>
<text x="1015.00" y="496.00" class="caption" text-anchor="start">input and output turn through equal angles.</text>
<text x="1015.00" y="521.00" class="caption" text-anchor="start">This explains the mechanism; it does not</text>
<text x="1015.00" y="546.00" class="caption" text-anchor="start">supply the 2:1 torque gain used in screening.</text>
<rect x="1015" y="590" width="520" height="178" rx="16" fill="#fff0d6" stroke="none"/>
<text x="1033.00" y="625.00" class="section" text-anchor="start">A longer knee lever restricts travel</text>
<text x="1033.00" y="661.00" class="caption" text-anchor="start">Example: 15 mm crank, 30 mm knee lever,</text>
<text x="1033.00" y="687.00" class="caption" text-anchor="start">170 mm rod and 170 mm pivot separation.</text>
<text x="1033.00" y="713.00" class="caption" text-anchor="start">Calculated output sweep: only 60.2°.</text>
<text x="1033.00" y="739.00" class="caption" text-anchor="start">That example is not selected for Tinfox.</text>
<text x="1015.00" y="811.00" class="section" text-anchor="start">Parts and details to engineer</text>
<text x="1015.00" y="850.00" class="caption" text-anchor="start">Metal rod with pinned or rod-end joints.</text>
<text x="1015.00" y="879.00" class="caption" text-anchor="start">Knee axle supported on both sides.</text>
<text x="1015.00" y="908.00" class="caption" text-anchor="start">Crank connection sized for rod forces.</text>
<text x="1015.00" y="937.00" class="caption" text-anchor="start">Stops before linkage alignment or collision.</text>
<text x="1015.00" y="966.00" class="caption" text-anchor="start">Actual travel and torque ratio across every pose.</text>
</svg>
